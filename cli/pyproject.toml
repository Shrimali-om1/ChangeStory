[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "changestory-cli"
version = "0.1.0"
description = "ChangeStory — CLI for analysing Python Git repository changes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
]

[project.scripts]
changestory = "changestory.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["changestory*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
